name: Backend — Build, Migrate & Deploy
 
on:
  workflow_dispatch:
  pull_request:
    types:
      - closed
    branches:
      - develop
      - main
       
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
 
jobs:
  # ─────────────────────────────────────────────
  # JOB 1 — Build & Push
  # ─────────────────────────────────────────────
  build-and-push:
    name: Build & Push (Django)
    runs-on: ubuntu-latest
 
    if: github.event.pull_request.merged == true
 
    permissions:
      id-token: write
      contents: read
 
    outputs:
      image-env: ${{ steps.env-tag.outputs.IMAGE_ENV }}
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Set environment tag
        id: env-tag
        run: |
          if [ "${{ github.base_ref }}" = "main" ]; then
            echo "IMAGE_ENV=staging" >> $GITHUB_OUTPUT
          else
            echo "IMAGE_ENV=dev" >> $GITHUB_OUTPUT
          fi
 
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}
 
      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Build, tag, and push image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACK }}:${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACK }}:${{ steps.env-tag.outputs.IMAGE_ENV }}
          cache-from: type=gha,scope=backend-${{ steps.env-tag.outputs.IMAGE_ENV }}
          cache-to: type=gha,scope=backend-${{ steps.env-tag.outputs.IMAGE_ENV }},mode=max
 
      - name: Print image URI
        run: |
          echo "✅ Image pushed:"
          echo "   ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY_BACK }}:${{ github.sha }}"
  migrate:
    name: Run Database Migrations
    runs-on: ubuntu-latest
    needs: build-and-push

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Run migration task
        run: |
          TASK_ARN=$(aws ecs run-task \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --task-definition ${{ vars.ECS_TASK_DEFINITION_BACKEND }} \
            --launch-type FARGATE \
            --network-configuration "awsvpcConfiguration={subnets=[${{ vars.PRIVATE_SUBNET_1 }},${{ vars.PRIVATE_SUBNET_2 }}],securityGroups=[${{ vars.BACKEND_SG }}],assignPublicIp=DISABLED}" \
            --overrides '{
              "containerOverrides": [{
                "name": "backend",
                "command": ["python", "manage.py", "migrate", "--noinput"]
              }]
            }' \
            --query 'tasks[0].taskArn' \
            --output text)

          echo "TASK_ARN=$TASK_ARN" >> $GITHUB_ENV
          echo "Migration task started: $TASK_ARN"

      - name: Wait for migration task to finish
        run: |
          aws ecs wait tasks-stopped \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --tasks $TASK_ARN

      - name: Check migration exit code
        run: |
          EXIT_CODE=$(aws ecs describe-tasks \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --tasks $TASK_ARN \
            --query 'tasks[0].containers[0].exitCode' \
            --output text)

          if [ "$EXIT_CODE" != "0" ]; then
            echo "❌ Migration failed with exit code $EXIT_CODE"
            echo "Check CloudWatch Logs group /ecs/nexo-backend for details"
            exit 1
          fi

          echo "✅ Migrations applied successfully"

  deploy:
    name: Deploy to ECS
    runs-on: ubuntu-latest
    needs: migrate

    permissions:
      id-token: write
      contents: read

    steps:
      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Deploy backend service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE_BACKEND }} \
            --force-new-deployment

      - name: Deploy celery-worker service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE_CELERY_WORKER }} \
            --force-new-deployment

      - name: Deploy websocket service
        run: |
          aws ecs update-service \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --service ${{ vars.ECS_SERVICE_WEBSOCKET }} \
            --force-new-deployment

      - name: Wait for services to stabilize
        run: |
          echo "Waiting for backend..."
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE_BACKEND }}

          echo "Waiting for celery-worker..."
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE_CELERY_WORKER }}

          echo "Waiting for websocket..."
          aws ecs wait services-stable \
            --cluster ${{ vars.ECS_CLUSTER }} \
            --services ${{ vars.ECS_SERVICE_WEBSOCKET }}

          echo "✅ All services deployed and stable"
