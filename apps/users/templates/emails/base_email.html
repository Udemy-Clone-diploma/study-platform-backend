<!DOCTYPE html>
<html lang="{{ locale }}">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ subject }}</title>
</head>
<body style="margin:0;padding:0;background-color:#f4f3f7;font-family:Arial,Helvetica,sans-serif;">
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background-color:#f4f3f7;padding:32px 16px;">
    <tr>
      <td align="center">
        <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px;background-color:#ffffff;border-radius:12px;overflow:hidden;box-shadow:0 4px 24px rgba(0,0,0,0.06);">
          <tr>
            <td style="height:4px;line-height:4px;font-size:0;background-image:linear-gradient(90deg,#fff4da 0%,#fcc4c3 50%,#a7bafa 100%);">&nbsp;</td>
          </tr>
          <tr>
            <td style="padding:14px 32px;text-align:center;border-bottom:1px solid #eeecf1;">
              <img src="cid:logo" alt="{{ company_name }}" width="96" height="75" style="display:inline-block;border:0;">
            </td>
          </tr>
          <tr>
            <td style="padding:40px 32px 8px 32px;">
              <h1 style="margin:0 0 20px 0;font-size:22px;line-height:1.3;color:#121212;font-weight:600;">{{ heading }}</h1>
              <p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;color:#5e5e5e;">{{ greeting }}</p>
              {% for paragraph in paragraphs %}
              <p style="margin:0 0 16px 0;font-size:15px;line-height:1.6;color:#5e5e5e;">{{ paragraph }}</p>
              {% endfor %}
              {% if cta_url %}
              <table role="presentation" cellpadding="0" cellspacing="0" style="margin:24px 0 8px 0;">
                <tr>
                  <td style="border-radius:999px;background-color:#003aff;">
                    <a href="{{ cta_url }}" style="display:inline-block;padding:14px 32px;font-size:14px;font-weight:600;letter-spacing:0.04em;color:#ffffff;text-decoration:none;border-radius:999px;">{{ cta_label }}</a>
                  </td>
                </tr>
              </table>
              {% if expiry_note %}
              <p style="margin:8px 0 24px 0;font-size:13px;color:#9ca3af;">{{ expiry_note }}</p>
              {% endif %}
              {% endif %}
            </td>
          </tr>
          <tr>
            <td style="padding:20px 32px 32px 32px;border-top:1px solid #eeecf1;">
              <p style="margin:0;font-size:12px;line-height:1.6;color:#9ca3af;">{{ footer_note }}</p>
              <p style="margin:12px 0 0 0;font-size:12px;color:#c3c0c9;">&copy; {{ year }} {{ company_name }}</p>
            </td>
          </tr>
        </table>
      </td>
    </tr>
  </table>
</body>
</html>
